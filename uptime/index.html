<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptime Dashboard | Boon</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --status-up: #2fbf71;
            --status-down: #ef5b5b;
            --status-unknown: #9ca3af;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f4f6fb;
        }

        .status-pill {
            border-radius: 999px;
            padding: 0.3rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .status-up {
            background: var(--status-up);
        }

        .status-down {
            background: var(--status-down);
        }

        .status-unknown {
            background: var(--status-unknown);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0.4rem rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">BOON.DEV</a>
            <div class="d-flex gap-2">
                <a href="../index.html" class="btn btn-outline-primary btn-sm">Main Site</a>
                <a href="../blog/" class="btn btn-outline-primary btn-sm">Blog</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="mb-4">
            <h1 class="display-5 fw-bold mb-2">Uptime Dashboard</h1>
            <p class="text-muted mb-0">Live checks for your public services. Update endpoint URLs directly in
                <code>uptime/uptime.js</code>.
            </p>
        </section>

        <section class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                    <h2 class="h5 mb-0">Service Status</h2>
                    <div class="d-flex gap-2">
                        <button id="refresh-now" class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-rotate-right me-1"></i>Refresh Now
                        </button>
                        <span id="last-updated" class="badge bg-light text-dark border">Last checked: --</span>
                    </div>
                </div>
                <div id="service-list" class="row g-3"></div>
            </div>
        </section>
    </main>

    <script src="./uptime.js"></script>
</body>

</html>
