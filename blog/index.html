<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Boon</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #f4f6fb;
        }

        .post-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 1rem 1.5rem rgba(0, 0, 0, 0.06);
        }

        .modal-content {
            border: none;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem 1.5rem;
        }

        #postModalImage {
            max-height: 250px;
            object-fit: cover;
            width: 100%;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        #postModalImage:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.375rem 0.75rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">BOON.DEV</a>
            <div class="d-flex gap-2">
                <a href="../index.html" class="btn btn-outline-primary btn-sm">Main Site</a>
                <a href="../uptime/" class="btn btn-outline-primary btn-sm">Uptime</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="mb-4">
            <h1 class="display-5 fw-bold mb-2">Blog</h1>
            <div class="row g-2">
                <div class="col-md-6">
                    <input id="search-input" type="search" class="form-control"
                        placeholder="Search posts by title, content, or tag...">
                </div>
                <div class="col-md-3">
                    <select id="tag-filter" class="form-select">
                        <option value="all">All tags</option>
                    </select>
                </div>
            </div>
        </section>

        <section>
            <div id="post-list" class="row g-3"></div>
        </section>
    </main>

    <!-- Post Modal -->
    <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="postModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <img id="postModalImage" src="" alt="" class="img-fluid rounded shadow">
                        </div>
                        <div class="col-md-8">
                            <p id="postModalDate" class="text-muted small mb-2"></p>
                            <div id="postModalTags" class="mb-3"></div>
                            <div id="postModalContent"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./posts.js"></script>
</body>

</html>
