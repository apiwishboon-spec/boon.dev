<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Boon</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #f4f6fb;
        }

        .post-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 1rem 1.5rem rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">BOON.DEV</a>
            <div class="d-flex gap-2">
                <a href="../index.html" class="btn btn-outline-primary btn-sm">Main Site</a>
                <a href="../uptime/" class="btn btn-outline-primary btn-sm">Uptime</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="mb-4">
            <h1 class="display-5 fw-bold mb-2">Blog</h1>
            <p class="text-muted mb-4">Post project updates, changelogs, and personal write-ups here.</p>
            <div class="row g-2">
                <div class="col-md-6">
                    <input id="search-input" type="search" class="form-control"
                        placeholder="Search posts by title, content, or tag...">
                </div>
                <div class="col-md-3">
                    <select id="tag-filter" class="form-select">
                        <option value="all">All tags</option>
                    </select>
                </div>
            </div>
        </section>

        <section>
            <div id="post-list" class="row g-3"></div>
        </section>
    </main>

    <script src="./posts.js"></script>
</body>

</html>
